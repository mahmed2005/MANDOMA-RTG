<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>RTG POS — واجهة سلسة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --bg-main:#0c0d12;
    --bg-card:#14161f;
    --bg-input:#1e212b;
    --primary-red:#ff1e42;
    --primary-red-hover:#d61332;
    --text-light:#f5f6f9;
    --text-muted:#9aa0b3;
    --border-color:#242936;
    --accent-green:#00c853;
    --accent-blue:#00b0ff;
    --glass:rgba(255,255,255,0.03);
    --transition:200ms;
  }
  :root.light{
    --bg-main:#f6f7fb;
    --bg-card:#ffffff;
    --bg-input:#f0f2f6;
    --primary-red:#d32f2f;
    --text-light:#0b0b0b;
    --text-muted:#6b7280;
    --border-color:#e6e9ef;
    --glass:rgba(0,0,0,0.03);
  }

  *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg,var(--bg-main),#07070a 120%);
    color:var(--text-light);
    min-height:100vh;
    display:flex;
    transition:background var(--transition),color var(--transition);
  }

  /* Layout: sidebar + main (mobile-first) */
  .app {
    display:flex;
    width:100%;
    min-height:100vh;
  }

  /* Sidebar: narrow vertical long bar */
  .sidebar {
    width:72px;
    background:var(--bg-card);
    border-right:1px solid var(--border-color);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px 8px;
    gap:10px;
    position:fixed;
    top:0;
    bottom:0;
    right:0; /* RTL: sidebar on right */
    z-index:60;
  }
  .sidebar .logo {
    width:48px;height:48px;border-radius:10px;background:linear-gradient(180deg,var(--primary-red),#c0142f);
    display:flex;align-items:center;justify-content:center;font-weight:900;color:white;font-size:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .side-btn {
    width:48px;height:48px;border-radius:10px;background:transparent;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);cursor:pointer;font-size:18px;transition:all var(--transition);
  }
  .side-btn.active{background:var(--primary-red);color:white;border-color:var(--primary-red);box-shadow:0 8px 18px rgba(255,30,66,0.12)}
  .side-btn.small{width:40px;height:40px;font-size:16px}

  /* collapse handle for small screens */
  .sidebar .collapse {
    margin-top:auto;
    width:48px;height:48px;border-radius:10px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;
  }

  /* Main area */
  .main {
    flex:1;
    margin-right:72px; /* leave space for sidebar (RTL) */
    padding:14px;
    width:100%;
  }

  header.app-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;
  }
  .brand {
    display:flex;flex-direction:column;
  }
  .brand h1{font-size:18px;font-weight:900;white-space:nowrap}
  .brand p{font-size:12px;color:var(--text-muted)}

  .header-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{background:var(--bg-card);border:1px solid var(--border-color);padding:8px;border-radius:8px;color:var(--text-muted);cursor:pointer}
  .theme-chip{background:var(--glass);padding:6px 10px;border-radius:999px;font-weight:700;color:var(--text-muted);font-size:12px}

  /* Cards and simple UI */
  .card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px;margin-bottom:12px}
  .card-title{font-weight:800;margin-bottom:10px;color:var(--text-light);font-size:14px}

  .input-field{width:100%;background:var(--bg-input);border:1px solid var(--border-color);color:var(--text-light);padding:10px;border-radius:8px;font-size:14px}
  .input-field:focus{outline:none;box-shadow:0 8px 20px rgba(0,0,0,0.35);border-color:var(--primary-red)}

  .btn{background:var(--primary-red);color:white;border:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:800;transition:transform var(--transition)}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;border:1px solid var(--border-color);color:var(--text-muted)}

  /* POS layout simplified */
  .pos-grid{display:grid;grid-template-columns:1fr;gap:12px}
  .cart-table{width:100%;border-collapse:collapse;font-size:13px}
  .cart-table th, .cart-table td{padding:8px;border-bottom:1px solid var(--border-color);text-align:right}
  .cart-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* status chips */
  .status-row{display:flex;gap:8px;margin-top:8px}
  .status-chip{padding:8px 10px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;opacity:0.6;background:var(--bg-input)}
  .status-chip.active{opacity:1;transform:translateY(-2px);border:1px solid rgba(255,255,255,0.04)}

  /* modal & toast */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:120}
  .modal-card{background:var(--bg-card);border:1px solid var(--border-color);padding:14px;border-radius:12px;width:100%;max-width:520px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:linear-gradient(90deg,var(--accent-green),#00bfa5);color:white;padding:10px 16px;border-radius:10px;display:none;z-index:200}

  /* responsive: for phones make sidebar overlay and main full width */
  @media (max-width:900px){
    .sidebar{right:0;left:auto;bottom:0;top:auto;height:64px;width:100%;flex-direction:row;padding:8px;justify-content:space-around;border-right:none;border-top:1px solid var(--border-color)}
    .sidebar .logo{display:none}
    .main{margin-right:0;margin-bottom:64px;padding:12px}
    .side-btn{width:44px;height:44px}
    .sidebar .collapse{display:none}
    .brand h1{font-size:16px}
    .pos-grid{grid-template-columns:1fr}
  }

  /* very small tweaks */
  .muted{color:var(--text-muted)}
  .center{text-align:center}
  .small{font-size:13px}
  .hidden{display:none}
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar (RTL: on the right for desktop; bottom on mobile) -->
  <nav class="sidebar" id="sidebar">
    <div class="logo" title="RTG">RTG</div>

    <button class="side-btn active" id="btn-pos" title="شاشة البيع" onclick="switchSimple('pos')">🛒</button>
    <button class="side-btn" id="btn-inv" title="إدارة المخزون" onclick="switchSimple('inventory')">📦</button>

    <!-- small menu for other actions (reports, returns) -->
    <button class="side-btn" id="btn-more" title="المزيد" onclick="toggleMoreMenu()">⋯</button>

    <div class="collapse" id="sidebar-collapse" title="الوضع" onclick="toggleTheme()">☼</div>
  </nav>

  <!-- Main content -->
  <main class="main" id="mainArea">
    <header class="app-header">
      <div class="brand">
        <h1 id="shopTitle">RTG-GEARX <span class="muted">POS</span></h1>
        <p class="muted small">واجهة سلسة ومبسطة — متوافقة مع الهاتف والحاسوب</p>
      </div>

      <div class="header-actions">
        <div class="theme-chip" id="themeChip">الوضع: مظلم</div>
        <button class="icon-btn" id="btn-sync" title="تحديث" onclick="syncAll()">🔄</button>
        <button class="icon-btn" id="btn-logout" title="تسجيل خروج" onclick="quickLogout()" style="display:none">🔒</button>
      </div>
    </header>

    <!-- POS view -->
    <section id="view-pos" class="card">
      <div class="card-title">🛒 شاشة البيع</div>

      <div class="pos-grid">
        <div>
          <label class="muted small">اضرب الباركود أو اختر المنتج:</label>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input id="posBarcode" class="input-field" placeholder="اضرب الكود ثم اضغط Enter" onkeypress="handleBarcodeKey(event)">
            <select id="posSelect" class="input-field" onchange="handleSelectAdd()" style="width:220px">
              <option value="">🔍 اختر منتج...</option>
            </select>
          </div>
        </div>

        <div class="card" style="padding:10px">
          <table class="cart-table" id="cartTable">
            <thead><tr><th>السلعة</th><th>السعر</th><th>كمية</th><th>الإجمالي</th><th></th></tr></thead>
            <tbody></tbody>
          </table>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
            <div class="muted small">إجمالي: <strong id="subtotal">0.00</strong> د.ل</div>
            <div style="display:flex;gap:8px">
              <input id="discount" type="number" class="input-field" value="0" style="width:110px" oninput="recalc()">
              <input id="delivery" type="number" class="input-field" value="0" style="width:110px" oninput="recalc()">
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
            <div class="muted small">الإجمالي النهائي: <strong id="finalTotal">0.00</strong> د.ل</div>
            <div class="cart-actions">
              <button class="btn" onclick="confirmSaveInvoice()">حفظ وترحيل</button>
              <button class="btn ghost" onclick="printInvoice()">طباعة</button>
            </div>
          </div>

          <div class="status-row" style="margin-top:12px">
            <div class="status-chip active" id="s-wait" onclick="setStatus('في الانتظار')">في الانتظار</div>
            <div class="status-chip" id="s-way" onclick="setStatus('في الطريق')">في الطريق</div>
            <div class="status-chip" id="s-done" onclick="setStatus('تم الاستلام')">تم الاستلام</div>
            <div class="status-chip" id="s-ret" onclick="setStatus('راجع')">راجع</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Inventory view -->
    <section id="view-inventory" class="card" style="display:none">
      <div class="card-title">📦 إدارة المخزون</div>

      <div style="display:grid;grid-template-columns:1fr;gap:10px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="newName" class="input-field" placeholder="اسم المنتج">
          <input id="newQty" type="number" class="input-field" placeholder="الكمية" style="width:120px">
          <input id="newPrice" type="number" class="input-field" placeholder="سعر البيع" style="width:140px">
          <input id="newBarcode" class="input-field" placeholder="كود/باركود" style="width:160px">
          <button class="btn" onclick="autoBarcode()">توليد</button>
          <button class="btn ghost" onclick="addProduct()">حفظ منتج</button>
        </div>

        <div class="card">
          <div class="muted small">قائمة المنتجات</div>
          <div style="max-height:320px;overflow:auto;margin-top:8px">
            <table class="cart-table" id="inventoryTable">
              <thead><tr><th>كود</th><th>اسم</th><th>كمية</th><th>سعر</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Simple hidden modal for confirmations -->
    <div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()">
      <div class="modal-card" id="modalCard">
        <div id="modalContent"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn ghost" onclick="closeModal()">إلغاء</button>
          <button class="btn" id="modalConfirmBtn">تأكيد</button>
        </div>
      </div>
    </div>

  </main>
</div>

<div id="toast">تمت العملية</div>

<script>
  /* ---------- بيانات محلية بسيطة (محاكاة) ---------- */
  const ADMIN_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxK9GGz87EzNCezo_Smm8If_wpVLTZ1UrlE-JDRkPQOwFaQVGkurxM_oj-8WE-BHMNc8Q/exec";
  let products = {}; // {code: {name, qty, price}}
  let cart = []; // [{code,name,price,qty}]
  let currentStatus = 'في الانتظار';

  /* ---------- واجهة بسيطة وسلسة ---------- */
  function switchSimple(view){
    document.getElementById('view-pos').style.display = view === 'pos' ? 'block' : 'none';
    document.getElementById('view-inventory').style.display = view === 'inventory' ? 'block' : 'none';
    document.getElementById('btn-pos').classList.toggle('active', view === 'pos');
    document.getElementById('btn-inv').classList.toggle('active', view === 'inventory');
    // scroll top for mobile
    document.getElementById('mainArea').scrollTo({top:0,behavior:'smooth'});
  }

  function toggleMoreMenu(){
    // simple menu: show modal with options (reports, returns, logout)
    showModal(`<div class="muted small">خيارات سريعة</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <button class="btn ghost" onclick="openReports()">التقارير</button>
        <button class="btn ghost" onclick="openReturns()">المرتجعات</button>
        <button class="btn ghost" onclick="showLogout()">تسجيل خروج</button>
      </div>`, ()=>closeModal());
    // hide confirm button
    document.getElementById('modalConfirmBtn').style.display = 'none';
  }

  /* ---------- theme ---------- */
  function toggleTheme(){
    const root = document.documentElement;
    const chip = document.getElementById('themeChip');
    if(root.classList.contains('light')){
      root.classList.remove('light'); chip.innerText = 'الوضع: مظلم';
      localStorage.setItem('rtg_theme','dark');
    } else {
      root.classList.add('light'); chip.innerText = 'الوضع: فاتح';
      localStorage.setItem('rtg_theme','light');
    }
  }
  // restore theme
  if(localStorage.getItem('rtg_theme') === 'light') document.documentElement.classList.add('light'), document.getElementById('themeChip').innerText='الوضع: فاتح';

  /* ---------- simple toast ---------- */
  function showToast(msg, t=2200){
    const el = document.getElementById('toast');
    el.innerText = msg; el.style.display='block'; el.style.opacity='1';
    clearTimeout(el._h);
    el._h = setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.style.display='none',200); }, t);
  }

  /* ---------- modal ---------- */
  function showModal(html, onConfirm){
    document.getElementById('modalContent').innerHTML = html;
    const btn = document.getElementById('modalConfirmBtn');
    btn.style.display = onConfirm ? 'inline-block' : 'none';
    btn.onclick = function(){ if(onConfirm) onConfirm(); closeModal(); };
    document.getElementById('modal').style.display = 'flex';
  }
  function closeModal(){ document.getElementById('modal').style.display = 'none'; }

  /* ---------- product sync (JSONP) ---------- */
  function syncAll(){
    const url = localStorage.getItem('rtg_script_url') || ADMIN_SCRIPT_URL;
    syncProducts(url);
    syncOrders(url);
  }

  function syncProducts(url){
    // JSONP callback
    window._handleProducts = function(data){
      products = data || {};
      renderProductSelect();
      renderInventory();
      showToast('تم تحديث المنتجات');
    };
    const s = document.createElement('script');
    s.src = `${url}?action=getProducts&callback=_handleProducts&ts=${Date.now()}`;
    s.id = 'pjson';
    document.body.appendChild(s);
    setTimeout(()=>{ if(document.getElementById('pjson')) document.getElementById('pjson').remove(); }, 3000);
  }

  function syncOrders(url){
    window._handleOrders = function(data){
      // not used heavily in this simplified UI, but kept for completeness
      window._orders = data || [];
      showToast('تم تحديث الفواتير');
    };
    const s = document.createElement('script');
    s.src = `${url}?action=getOrders&callback=_handleOrders&ts=${Date.now()}`;
    s.id = 'ojson';
    document.body.appendChild(s);
    setTimeout(()=>{ if(document.getElementById('ojson')) document.getElementById('ojson').remove(); }, 3000);
  }

  /* ---------- render helpers ---------- */
  function renderProductSelect(){
    const sel = document.getElementById('posSelect');
    sel.innerHTML = '<option value="">🔍 اختر منتج...</option>';
    for(const code in products){
      const p = products[code];
      sel.innerHTML += `<option value="${code}">${p.name} — ${p.qty} قطعة</option>`;
    }
  }
  function renderInventory(){
    const tbody = document.querySelector('#inventoryTable tbody');
    tbody.innerHTML = '';
    for(const code in products){
      const p = products[code];
      tbody.innerHTML += `<tr><td>${code}</td><td style="font-weight:800">${p.name}</td><td style="font-weight:900;color:var(--accent-blue)">${p.qty}</td><td style="color:var(--primary-red);font-weight:900">${(parseFloat(p.price)||0).toFixed(2)}</td></tr>`;
    }
  }

  /* ---------- POS actions ---------- */
  function handleBarcodeKey(e){
    if(e.key === 'Enter'){
      const code = document.getElementById('posBarcode').value.trim();
      if(!code) return;
      addToCart(code);
      document.getElementById('posBarcode').value = '';
    }
  }
  function handleSelectAdd(){
    const code = document.getElementById('posSelect').value;
    if(!code) return;
    addToCart(code);
    document.getElementById('posSelect').value = '';
  }

  function addToCart(code){
    if(!products[code]){ alert('المنتج غير موجود'); return; }
    const p = products[code];
    const exist = cart.find(x=>x.code===code);
    if(exist){
      if(exist.qty + 1 > (parseInt(p.qty)||0)){ alert('الكمية تتجاوز المخزون'); return; }
      exist.qty++;
    } else {
      cart.push({ code, name: p.name, price: parseFloat(p.price)||0, qty:1 });
    }
    renderCart();
  }

  function renderCart(){
    const tbody = document.querySelector('#cartTable tbody');
    tbody.innerHTML = '';
    cart.forEach((it, idx)=>{
      tbody.innerHTML += `<tr>
        <td style="font-weight:800">${it.name}</td>
        <td>${it.price.toFixed(2)}</td>
        <td><input type="number" value="${it.qty}" min="1" style="width:70px" onchange="changeQty(${idx},this.value)"></td>
        <td style="color:var(--primary-red);font-weight:900">${(it.price*it.qty).toFixed(2)}</td>
        <td><button class="btn ghost" onclick="removeFromCart(${idx})">✕</button></td>
      </tr>`;
    });
    recalc();
  }

  function changeQty(i,v){
    const q = parseInt(v) || 1;
    const code = cart[i].code;
    if(q > (parseInt(products[code].qty)||0)){ alert('الكمية تتجاوز المخزون'); return; }
    cart[i].qty = q;
    renderCart();
  }
  function removeFromCart(i){ cart.splice(i,1); renderCart(); }

  function recalc(){
    let sub = 0;
    cart.forEach(x=> sub += x.price * x.qty);
    document.getElementById('subtotal').innerText = sub.toFixed(2);
    const disc = parseFloat(document.getElementById('discount').value) || 0;
    const del = parseFloat(document.getElementById('delivery').value) || 0;
    const final = Math.max(0, (sub - disc) + del);
    document.getElementById('finalTotal').innerText = final.toFixed(2);
  }

  function setStatus(s){
    currentStatus = s;
    ['s-wait','s-way','s-done','s-ret'].forEach(id=>document.getElementById(id).classList.remove('active'));
    if(s==='في الانتظار') document.getElementById('s-wait').classList.add('active');
    if(s==='في الطريق') document.getElementById('s-way').classList.add('active');
    if(s==='تم الاستلام') document.getElementById('s-done').classList.add('active');
    if(s==='راجع') document.getElementById('s-ret').classList.add('active');
  }

  /* ---------- save invoice (simple flow with revert support) ---------- */
  function confirmSaveInvoice(){
    if(cart.length === 0){ alert('السلة فارغة'); return; }
    showModal(`<div class="muted small">هل تريد حفظ وترحيل الفاتورة الآن؟</div>`, saveInvoice);
  }

  function saveInvoice(){
    const url = localStorage.getItem('rtg_script_url') || ADMIN_SCRIPT_URL;
    const invId = 'RTG-' + Math.floor(100000 + Math.random()*900000);
    const date = new Date().toLocaleString('ar-LY');
    const items = cart.map(i=>({code:i.code,qty:i.qty}));
    const sales = cart.reduce((s,i)=>s + i.price*i.qty,0);
    const disc = parseFloat(document.getElementById('discount').value) || 0;
    const del = parseFloat(document.getElementById('delivery').value) || 0;
    const total = (sales - disc) + del;

    const payload = {
      action:'addOrder',
      invoiceId:invId,
      date:date,
      productsList: cart.map(x=>`${x.name} (${x.qty})`).join(' | '),
      totalSales: total.toFixed(2),
      netProfit: (sales - disc).toFixed(2),
      orderStatus: currentStatus,
      cartItems: items
    };

    // push to cloud (no-cors as original)
    showToast('⏳ جاري الترحيل...');
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(()=> {
        showToast('✅ تم الحفظ والترحيل');
        // clear cart and refresh products
        cart = []; renderCart();
        setTimeout(()=> syncProducts(url), 800);
      })
      .catch(()=> showToast('حدث خطأ أثناء الترحيل',2000));
  }

  /* ---------- inventory actions ---------- */
  function autoBarcode(){
    document.getElementById('newBarcode').value = 'PROD-' + Math.floor(100000 + Math.random()*900000);
  }
  function addProduct(){
    const url = localStorage.getItem('rtg_script_url') || ADMIN_SCRIPT_URL;
    const name = document.getElementById('newName').value.trim();
    const qty = parseInt(document.getElementById('newQty').value) || 0;
    const price = parseFloat(document.getElementById('newPrice').value) || 0;
    const code = document.getElementById('newBarcode').value.trim();
    if(!name || !code){ alert('أكمل الاسم والكود'); return; }
    const payload = { action:'addProduct', barcode:code, name:name, qty:qty, price:price.toFixed(2) };
    showToast('⏳ جاري حفظ المنتج...');
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(()=> {
        showToast('✅ تم حفظ المنتج');
        document.getElementById('newName').value=''; document.getElementById('newQty').value=''; document.getElementById('newPrice').value=''; document.getElementById('newBarcode').value='';
        setTimeout(()=> syncProducts(url), 900);
      })
      .catch(()=> showToast('خطأ أثناء الحفظ',2000));
  }

  /* ---------- simple utilities ---------- */
  function openReports(){
    closeModal();
    showModal('<div class="muted small">قائمة التقارير متاحة في لوحة الإدارة (مبسطة هنا).</div>');
  }
  function openReturns(){
    closeModal();
    showModal(`<div class="muted small">إرجاع فاتورة</div>
      <div style="margin-top:10px"><input id="returnId" class="input-field" placeholder="أدخل رقم الفاتورة"></div>`,
      ()=>{ const id = document.getElementById('returnId').value.trim(); if(id) processReturn(id); });
  }
  function processReturn(id){
    const url = localStorage.getItem('rtg_script_url') || ADMIN_SCRIPT_URL;
    const payload = { action:'markAsReturned', invoiceId:id, cartItems:[] };
    showToast('⏳ جاري إرسال طلب الإرجاع...');
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(()=> { showToast('✅ تم تحويل الفاتورة إلى راجع'); setTimeout(()=> syncProducts(url),900); })
      .catch(()=> showToast('خطأ أثناء الإرجاع',2000));
  }

  function showLogout(){
    closeModal();
    showModal('<div class="muted small">هل تريد تسجيل الخروج؟</div>', ()=>{ quickLogout(); });
  }
  function quickLogout(){
    localStorage.removeItem('rtg_license'); localStorage.removeItem('rtg_script_url'); localStorage.removeItem('rtg_shop_title');
    location.reload();
  }

  /* ---------- print invoice (simple) ---------- */
  function printInvoice(){
    if(cart.length === 0){ alert('السلة فارغة'); return; }
    const title = localStorage.getItem('rtg_shop_title') || 'RTG POS';
    const html = `<div style="direction:rtl;font-family:'Cairo',sans-serif;padding:10px;color:black;background:white">
      <h2 style="text-align:center">${title}</h2>
      <table style="width:100%;border-collapse:collapse;text-align:right">
        <thead><tr><th>السلعة</th><th>الكمية</th><th>السعر</th></tr></thead>
        <tbody>${cart.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${(i.price*i.qty).toFixed(2)} د.ل</td></tr>`).join('')}</tbody>
      </table>
      <div style="margin-top:10px">الإجمالي: ${document.getElementById('finalTotal').innerText} د.ل</div>
    </div>`;
    const w = window.open('','_blank','width=600,height=600');
    w.document.write(html); w.document.close();
    setTimeout(()=>{ w.print(); w.close(); }, 600);
  }

  /* ---------- initial load ---------- */
  window.addEventListener('DOMContentLoaded', ()=>{
    // try to load products from saved script url
    const url = localStorage.getItem('rtg_script_url') || ADMIN_SCRIPT_URL;
    syncProducts(url);
    // default view POS
    switchSimple('pos');
  });
</script>
</body>
</html>
